<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil Member — Circle OLEXTY</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script defer src="js/auth.js"></script><script defer src="js/profile.js"></script></head><body><header class="navbar"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>CIRCLE <b>FREE FIRE</b></span></a><nav><a href="index.html">Beranda</a><a href="admin.html" id="adminNav" class="hidden">Admin</a><button class="nav-button" data-logout>Logout ↗</button></nav></header><main class="container profile-page"><div class="section-head"><span class="eyebrow">MEMBER AREA</span><h1>Profil <em>kamu.</em></h1><p>Atur identitas circle dan informasi Free Fire.</p></div><div class="profile-layout"><aside class="profile-summary glass"><div id="profileAvatar" class="profile-avatar">C</div><h2 id="profileUsername">Memuat…</h2><p id="profileEmail" class="muted"></p><span id="profileRole" class="role-badge">MEMBER</span></aside><section class="profile-editor glass"><h2>Informasi profil</h2><form id="profileForm" class="form-stack"><label>Upload avatar<input type="file" name="avatar" accept="image/png,image/jpeg,image/webp"></label><label>Bio<textarea name="bio" rows="3" maxlength="400" placeholder="Ceritakan sedikit tentang kamu"></textarea></label><label>Nickname Free Fire<input name="nickname_epep" maxlength="40" placeholder="Nickname di game"></label><label>ID Free Fire<input name="id_epep" maxlength="40" placeholder="ID akun game"></label><label class="check-row"><input type="checkbox" name="id_epep_public"> Tampilkan ID Free Fire di profil publik</label><div id="profileMessage" class="form-message hidden"></div><button class="btn primary" type="submit">SIMPAN PROFIL</button></form><hr class="separator"><h2>Ganti password</h2><form id="passwordForm" class="form-stack"><label>Password baru<input name="password" type="password" minlength="6" required autocomplete="new-password"></label><div id="passwordMessage" class="form-message hidden"></div><button class="btn ghost" type="submit">PERBARUI PASSWORD</button></form></section></div></main><footer class="footer"><span>© <span id="yearNow"></span> Circle OLEXTY</span></footer></body></html>
